name: Process Podcast Transcript

on:
  workflow_dispatch:
  push:
    paths:
      - 'transcripts/**/*.docx'

jobs:
  process:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic python-docx

      - name: Find and process transcripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Get .docx files changed in this push
          git diff --name-only HEAD~1 HEAD | grep 'transcripts/.*\.docx' > /tmp/changed_files.txt || true

          # Fallback: use files listed in the commit (first push with no parent)
          if [ ! -s /tmp/changed_files.txt ]; then
            git show --name-only --format="" HEAD | grep 'transcripts/.*\.docx' > /tmp/changed_files.txt || true
          fi

          echo "Files to process:"
          cat /tmp/changed_files.txt

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            if [ -f "$FILE" ]; then
              echo "Processing: $FILE"
              SHOW=$(echo "$FILE" | cut -d'/' -f2)
              python process_transcript.py "$FILE" "$SHOW"
            else
              echo "Skipping (not found): $FILE"
            fi
          done < /tmp/changed_files.txt

      - name: Commit updated episodes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.json
          git diff --staged --quiet || git commit -m "Update episodes.json [automated]"
          git push
