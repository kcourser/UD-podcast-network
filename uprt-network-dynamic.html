<!-- ============================================================
     UPRT+ Network — Upright Digital Podcast Episode Network
     Dynamic embed for Webflow — paste into an Embed element
     v2: filled show-color nodes, labels outside circles,
     dual-handle month/year date slider, show legend, improved tooltip
     ============================================================ -->

<style>
#ud-network, #ud-network * { box-sizing: border-box; margin: 0; padding: 0; }

#ud-network {
  background: #0f1117;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 760px;
  width: 100%;
}

/* ── Header ── */
#ud-header {
  padding: 14px 20px;
  border-bottom: 1px solid #1e2330;
  background: #0d1020;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 16px;
}
#ud-header h2 {
  font-size: 15px;
  font-weight: 700;
  color: #f1f5f9;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
#ud-header p { font-size: 11px; color: #64748b; margin-top: 2px; }

/* ── Show filter dropdown ── */
#ud-show-filter { position: relative; }
#ud-shows-btn {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid #2d3748;
  background: transparent;
  color: #94a3b8;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  white-space: nowrap;
}
#ud-shows-btn:hover, #ud-shows-btn.open { border-color: #4b5563; color: #e2e8f0; background: #1e2330; }
#ud-shows-panel {
  display: none;
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  background: #0d1020;
  border: 1px solid #2d3748;
  border-radius: 8px;
  padding: 6px;
  min-width: 210px;
  z-index: 200;
  box-shadow: 0 8px 24px #00000088;
}
#ud-shows-panel.open { display: block; }
.ud-show-check {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 5px;
  cursor: pointer; font-size: 11px; color: #94a3b8;
  transition: background 0.1s; user-select: none;
}
.ud-show-check:hover { background: #1e2330; color: #e2e8f0; }
.ud-check-box {
  width: 13px; height: 13px; border-radius: 3px;
  border: 1.5px solid #4b5563; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
}
.ud-check-box.checked { border-color: transparent; }
.ud-check-box.checked::after { content: '✓'; font-size: 9px; color: #fff; font-weight: 700; }
.ud-show-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ud-shows-actions {
  border-top: 1px solid #1e2330; margin-top: 4px; padding-top: 6px;
  display: flex; gap: 4px;
}
.ud-shows-action-btn {
  flex: 1; padding: 4px 6px; border-radius: 4px;
  border: 1px solid #2d3748; background: transparent;
  color: #64748b; font-size: 10px; cursor: pointer;
  font-family: inherit; transition: all 0.15s;
}
.ud-shows-action-btn:hover { background: #1e2330; color: #94a3b8; }

/* ── Date range bar ── */
#ud-date-bar {
  background: #0d1020;
  border-bottom: 1px solid #1e2330;
  padding: 9px 20px 10px;
  flex-shrink: 0;
}
#ud-date-bar-header {
  display: flex; align-items: center; gap: 5px; margin-bottom: 9px;
}
#ud-date-bar-label {
  font-size: 9px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: #475569; margin-right: 4px;
}
#ud-date-from-label, #ud-date-to-label {
  font-size: 11px; font-weight: 600; color: #60a5fa;
}
#ud-date-sep { font-size: 10px; color: #334155; }
#ud-date-count { margin-left: auto; font-size: 10px; color: #475569; }

/* Dual range slider */
#ud-slider-wrap {
  position: relative; height: 20px;
  display: flex; align-items: center;
}
#ud-range-track {
  position: absolute; left: 0; right: 0;
  height: 4px; background: #1e2330;
  border-radius: 2px; pointer-events: none;
}
#ud-range-fill {
  position: absolute; height: 100%;
  background: linear-gradient(90deg, #3b82f6, #f97316);
  border-radius: 2px;
}
input.ud-rng {
  position: absolute; width: 100%; left: 0;
  height: 4px; -webkit-appearance: none; appearance: none;
  background: transparent; pointer-events: none; outline: none; z-index: 2;
}
input.ud-rng::-webkit-slider-thumb {
  -webkit-appearance: none; pointer-events: all; cursor: grab;
  width: 16px; height: 16px; border-radius: 50%;
  background: #1e3a5f; border: 2px solid #60a5fa;
  transition: border-color 0.15s, transform 0.1s;
}
input.ud-rng::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.15); border-color: #93c5fd; }
input.ud-rng::-moz-range-thumb {
  pointer-events: all; cursor: grab; width: 14px; height: 14px;
  border-radius: 50%; background: #1e3a5f; border: 2px solid #60a5fa;
}
#ud-slider-months {
  display: flex; justify-content: space-between;
  margin-top: 5px; font-size: 8px; color: #334155;
  letter-spacing: 0.03em;
}

/* ── Body layout ── */
#ud-layout { display: flex; flex: 1; overflow: hidden; }

#ud-sidebar {
  width: 200px; flex-shrink: 0;
  background: #0d1020; border-right: 1px solid #1e2330;
  display: flex; flex-direction: column; overflow: hidden;
}
#ud-sidebar-title {
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: #475569; padding: 12px 14px 6px; flex-shrink: 0;
}
#ud-match-count {
  font-size: 12px; color: #60a5fa; padding: 4px 14px 0;
  font-weight: 600; flex-shrink: 0; display: none;
}
#ud-topic-list {
  overflow-y: auto; flex: 1; padding: 4px 6px;
  scrollbar-width: thin; scrollbar-color: #1e2330 transparent;
}
.ud-topic-btn {
  display: flex; align-items: center; gap: 7px; width: 100%;
  padding: 6px 8px; border: none; background: transparent;
  color: #94a3b8; font-size: 11px; cursor: pointer; border-radius: 5px;
  text-align: left; transition: background 0.15s, color 0.15s; font-family: inherit;
}
.ud-topic-btn:hover { background: #1e2330; color: #e2e8f0; }
.ud-topic-btn.active { background: #1e2d45; color: #60a5fa; font-weight: 600; }
.ud-topic-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ud-topic-count {
  margin-left: auto; font-size: 9px; color: #475569;
  background: #1e2330; padding: 1px 5px; border-radius: 10px;
}
.ud-topic-btn.active .ud-topic-count { background: #1e3a5f; color: #93c5fd; }
#ud-clear-btn {
  margin: 6px; padding: 6px; border: 1px solid #1e2330;
  background: transparent; color: #64748b; font-size: 10px;
  cursor: pointer; border-radius: 5px; transition: all 0.15s;
  flex-shrink: 0; font-family: inherit;
}
#ud-clear-btn:hover { background: #1e2330; color: #94a3b8; }

/* ── Graph ── */
#ud-graph-wrap { flex: 1; position: relative; overflow: hidden; }
#ud-graph-wrap svg { width: 100%; height: 100%; display: block; }

/* ── Tooltip ── */
#ud-tooltip {
  position: absolute; background: #1a2035; border: 1px solid #2d3748;
  border-radius: 9px; padding: 10px 13px; font-size: 11px;
  pointer-events: none; opacity: 0; transition: opacity 0.15s;
  max-width: 270px; z-index: 10;
}

/* ── Show legend ── */
#ud-legend {
  position: absolute; bottom: 12px; left: 10px;
  background: #0d102099; border: 1px solid #1e2330;
  border-radius: 7px; padding: 7px 10px; pointer-events: none;
}
.ud-legend-title {
  font-size: 8px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: #334155; margin-bottom: 5px;
}
.ud-legend-row {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 3px; font-size: 9.5px; color: #64748b;
}
.ud-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ── Loading ── */
#ud-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px; color: #475569; font-size: 13px;
}
#ud-spinner {
  width: 28px; height: 28px; border: 3px solid #1e2330;
  border-top-color: #f97316; border-radius: 50%;
  animation: ud-spin 0.8s linear infinite;
}
@keyframes ud-spin { to { transform: rotate(360deg); } }
</style>

<div id="ud-network">

  <!-- Header -->
  <div id="ud-header">
    <div>
      <h2 id="ud-title">UPRT<span style="color:#f97316">+</span> Network</h2>
      <p>Upright Digital · 6 shows · filter by topic, show, or date · hover nodes · drag to explore</p>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
      <div id="ud-show-filter">
        <button id="ud-shows-btn">All Shows ▾</button>
        <div id="ud-shows-panel">
          <div id="ud-shows-list"></div>
          <div class="ud-shows-actions">
            <button class="ud-shows-action-btn" id="ud-shows-all-btn">Select All</button>
            <button class="ud-shows-action-btn" id="ud-shows-none-btn">Clear All</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Date range slider -->
  <div id="ud-date-bar">
    <div id="ud-date-bar-header">
      <span id="ud-date-bar-label">Date range</span>
      <span id="ud-date-from-label">—</span>
      <span id="ud-date-sep">–</span>
      <span id="ud-date-to-label">—</span>
      <span id="ud-date-count"></span>
    </div>
    <div id="ud-slider-wrap">
      <div id="ud-range-track">
        <div id="ud-range-fill"></div>
      </div>
      <input type="range" class="ud-rng" id="ud-range-from" min="0" max="1" value="0" step="1">
      <input type="range" class="ud-rng" id="ud-range-to"   min="0" max="1" value="1" step="1">
    </div>
    <div id="ud-slider-months"></div>
  </div>

  <!-- Body -->
  <div id="ud-layout">
    <div id="ud-sidebar">
      <div id="ud-sidebar-title">Topics</div>
      <div id="ud-match-count"></div>
      <div id="ud-topic-list"></div>
      <button id="ud-clear-btn">Show all episodes</button>
    </div>
    <div id="ud-graph-wrap">
      <svg id="ud-graph"></svg>
      <div id="ud-tooltip"></div>
      <div id="ud-legend"></div>
      <div id="ud-loading">
        <div id="ud-spinner"></div>
        <span>Loading episodes&hellip;</span>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
(function () {

  const DATA_URL = "https://raw.githubusercontent.com/kcourser/UD-podcast-network/main/episodes.json";

  function waitForD3(cb) {
    if (typeof d3 !== 'undefined') cb();
    else setTimeout(() => waitForD3(cb), 80);
  }

  waitForD3(() => {
    fetch(DATA_URL)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => buildGraph(data))
      .catch(err => {
        document.getElementById('ud-loading').innerHTML =
          '<span style="color:#ef4444">Could not load episodes: ' + err.message + '</span>';
      });
  });

  function buildGraph(data) {
    const { meta, episodes } = data;
    const TOPIC_COLORS = meta.topic_colors || {};
    const SHOW_COLORS = Object.assign({
      "PetroNoia":             "#f97316",
      "Oil Field 360":         "#f59e0b",
      "Energy Espresso":       "#d97706",
      "The IT Crowd":          "#06b6d4",
      "The Energy Pipeline":   "#3b82f6",
      "In Basin Observations": "#10b981",
    }, meta.show_colors || {});

    // ── Month helpers ─────────────────────────────────────────────────────────
    const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function fmtMonthStr(str) {
      if (!str) return '—';
      const [y, m] = str.split('-');
      return MONTH_NAMES[parseInt(m, 10) - 1] + ' ' + y;
    }

    function fmtDate(dateStr) {
      if (!dateStr) return '';
      return fmtMonthStr(dateStr.slice(0, 7));
    }

    // ── Date range setup ──────────────────────────────────────────────────────
    const allMonths = [...new Set(
      episodes.map(e => e.date ? e.date.slice(0, 7) : null).filter(Boolean)
    )].sort();

    const N = Math.max(allMonths.length - 1, 1);
    let dateFrom = 0;
    let dateTo   = N;

    const rangeFrom = document.getElementById('ud-range-from');
    const rangeTo   = document.getElementById('ud-range-to');
    const rangeFill = document.getElementById('ud-range-fill');
    const fromLabel = document.getElementById('ud-date-from-label');
    const toLabel   = document.getElementById('ud-date-to-label');
    const dateCount = document.getElementById('ud-date-count');

    rangeFrom.max = rangeTo.max = N;
    rangeFrom.value = 0;
    rangeTo.value   = N;

    function updateSliderUI() {
      const from = parseInt(rangeFrom.value, 10);
      const to   = parseInt(rangeTo.value,   10);
      const pctFrom = (from / N) * 100;
      const pctTo   = (to   / N) * 100;
      rangeFill.style.left  = pctFrom + '%';
      rangeFill.style.right = (100 - pctTo) + '%';
      fromLabel.textContent = fmtMonthStr(allMonths[from] || allMonths[0]);
      toLabel.textContent   = fmtMonthStr(allMonths[to]   || allMonths[allMonths.length - 1]);
    }

    // Tick labels — show up to 10 evenly spaced months
    const monthsEl  = document.getElementById('ud-slider-months');
    const tickStep  = Math.max(1, Math.floor(allMonths.length / 9));
    const tickIdxs  = [];
    for (let i = 0; i < allMonths.length; i += tickStep) tickIdxs.push(i);
    if (tickIdxs[tickIdxs.length - 1] !== allMonths.length - 1) tickIdxs.push(allMonths.length - 1);
    tickIdxs.forEach(i => {
      const span = document.createElement('span');
      span.textContent = fmtMonthStr(allMonths[i]);
      monthsEl.appendChild(span);
    });

    updateSliderUI();

    rangeFrom.addEventListener('input', () => {
      if (parseInt(rangeFrom.value) > parseInt(rangeTo.value)) rangeFrom.value = rangeTo.value;
      dateFrom = parseInt(rangeFrom.value, 10);
      updateSliderUI();
      activeTopics.clear();
      rebuildGraph();
    });
    rangeTo.addEventListener('input', () => {
      if (parseInt(rangeTo.value) < parseInt(rangeFrom.value)) rangeTo.value = rangeFrom.value;
      dateTo = parseInt(rangeTo.value, 10);
      updateSliderUI();
      activeTopics.clear();
      rebuildGraph();
    });

    // ── Show filter ───────────────────────────────────────────────────────────
    const allShows      = [...new Set(episodes.map(e => e.show))].sort();
    const selectedShows = new Set(allShows);
    let   activeTopics  = new Set();

    document.getElementById('ud-loading').style.display = 'none';

    // ── Show legend ───────────────────────────────────────────────────────────
    const legendEl = document.getElementById('ud-legend');
    legendEl.innerHTML = '<div class="ud-legend-title">Shows</div>' +
      allShows.map(s =>
        `<div class="ud-legend-row"><div class="ud-legend-dot" style="background:${SHOW_COLORS[s]||'#888'}"></div>${s}</div>`
      ).join('');

    // ── Show dropdown ─────────────────────────────────────────────────────────
    const showsBtn   = document.getElementById('ud-shows-btn');
    const showsPanel = document.getElementById('ud-shows-panel');
    const showsList  = document.getElementById('ud-shows-list');

    function updateShowBtn() {
      showsBtn.textContent = (selectedShows.size === 0 || selectedShows.size === allShows.length)
        ? 'All Shows ▾'
        : `${selectedShows.size} Show${selectedShows.size > 1 ? 's' : ''} ▾`;
    }

    function buildShowsList() {
      showsList.innerHTML = '';
      allShows.forEach(show => {
        const row = document.createElement('div');
        row.className = 'ud-show-check';
        const box = document.createElement('div');
        box.className = 'ud-check-box' + (selectedShows.has(show) ? ' checked' : '');
        box.style.background = selectedShows.has(show) ? (SHOW_COLORS[show] || '#f97316') : 'transparent';
        const dot = document.createElement('div');
        dot.className = 'ud-show-dot';
        dot.style.background = SHOW_COLORS[show] || '#f97316';
        const label = document.createElement('span');
        label.textContent = show;
        row.appendChild(box); row.appendChild(dot); row.appendChild(label);
        row.addEventListener('click', () => {
          if (selectedShows.has(show)) { if (selectedShows.size > 1) selectedShows.delete(show); }
          else selectedShows.add(show);
          buildShowsList(); updateShowBtn(); activeTopics.clear(); rebuildGraph();
        });
        showsList.appendChild(row);
      });
    }

    showsBtn.addEventListener('click', e => {
      e.stopPropagation();
      showsPanel.classList.toggle('open');
      showsBtn.classList.toggle('open', showsPanel.classList.contains('open'));
    });
    document.getElementById('ud-shows-all-btn').addEventListener('click', () => {
      allShows.forEach(s => selectedShows.add(s));
      buildShowsList(); updateShowBtn(); activeTopics.clear(); rebuildGraph();
    });
    document.getElementById('ud-shows-none-btn').addEventListener('click', () => {
      selectedShows.clear(); selectedShows.add(allShows[0]);
      buildShowsList(); updateShowBtn(); activeTopics.clear(); rebuildGraph();
    });
    document.addEventListener('click', e => {
      if (!document.getElementById('ud-show-filter').contains(e.target)) {
        showsPanel.classList.remove('open'); showsBtn.classList.remove('open');
      }
    });

    buildShowsList(); updateShowBtn();

    // ── Graph ─────────────────────────────────────────────────────────────────
    const wrap = document.getElementById('ud-graph-wrap');
    const svg  = d3.select('#ud-graph');
    const W = () => wrap.clientWidth;
    const H = () => wrap.clientHeight;

    const g    = svg.append('g');
    const zoom = d3.zoom().scaleExtent([0.15, 4])
      .on('zoom', e => g.attr('transform', e.transform));
    svg.call(zoom);
    svg.call(zoom.transform, d3.zoomIdentity.translate(W()/2, H()/2).scale(0.72).translate(-W()/2, -H()/2));

    let linkSel, nodeSel, sim;

    function truncName(name) {
      if (!name) return '—';
      if (name.includes('&')) {
        const parts = name.split('&');
        return parts[0].trim().split(' ')[0] + ' & ' + parts[1].trim().split(' ')[0];
      }
      const p = name.split(' ');
      return p[0] + (p.length > 1 ? ' ' + p[p.length - 1][0] + '.' : '');
    }

    function rebuildGraph() {
      // Filter by show + date range
      const visEps = episodes
        .filter(e => selectedShows.has(e.show))
        .filter(e => {
          if (!e.date || allMonths.length === 0) return true;
          const ms = e.date.slice(0, 7);
          const idx = allMonths.indexOf(ms);
          if (idx < 0) return true;
          return idx >= dateFrom && idx <= dateTo;
        });

      dateCount.textContent = `${visEps.length} episode${visEps.length !== 1 ? 's' : ''}`;

      const usedTopics  = [...new Set(visEps.flatMap(e => e.topics))].sort();
      const topicCounts = {};
      usedTopics.forEach(t => { topicCounts[t] = visEps.filter(e => e.topics.includes(t)).length; });

      buildSidebar(usedTopics, topicCounts);

      const nodes = [
        ...visEps.map(ep => ({ id: ep.id, type: 'episode', data: ep })),
        ...usedTopics.map(t => ({ id: 'topic_' + t, type: 'topic', label: t })),
      ];
      const links = visEps.flatMap(ep =>
        ep.topics.map(t => ({ source: ep.id, target: 'topic_' + t, topic: t }))
      );

      g.selectAll('*').remove();
      if (sim) sim.stop();

      svg.attr('viewBox', `0 0 ${W()} ${H()}`);
      svg.call(zoom.transform, d3.zoomIdentity.translate(W()/2, H()/2).scale(0.72).translate(-W()/2, -H()/2));

      sim = d3.forceSimulation(nodes)
        .force('link',      d3.forceLink(links).id(d => d.id).distance(110).strength(0.4))
        .force('charge',    d3.forceManyBody().strength(d => d.type === 'topic' ? -420 : -180))
        .force('center',    d3.forceCenter(W()/2, H()/2))
        .force('collision', d3.forceCollide(d => d.type === 'topic' ? 48 : 32));

      // Links — colored by topic
      linkSel = g.append('g').selectAll('line').data(links).join('line')
        .attr('stroke',         d => TOPIC_COLORS[d.topic] || '#0ea5e9')
        .attr('stroke-width',   1.2)
        .attr('stroke-opacity', 0.28);

      // Node groups with drag
      nodeSel = g.append('g').selectAll('g').data(nodes).join('g')
        .call(d3.drag()
          .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

      // ── Episode nodes — filled with show color ──
      nodeSel.filter(d => d.type === 'episode').append('circle')
        .attr('r',            16)
        .attr('fill',         d => SHOW_COLORS[d.data.show] || '#f97316')
        .attr('stroke',       '#0f1117')
        .attr('stroke-width', 1.5)
        .attr('cursor',       'pointer');

      // Episode labels — below circle, colored, with dark outline for contrast
      nodeSel.filter(d => d.type === 'episode').append('text')
        .attr('text-anchor',      'middle')
        .attr('dy',               '30px')
        .attr('font-size',        '10px')
        .attr('font-weight',      '500')
        .attr('fill',             d => SHOW_COLORS[d.data.show] || '#f97316')
        .attr('pointer-events',   'none')
        .attr('paint-order',      'stroke')
        .attr('stroke',           '#0f1117')
        .attr('stroke-width',     '3px')
        .attr('stroke-linejoin',  'round')
        .text(d => truncName(d.data.name));

      // ── Topic hubs ──
      nodeSel.filter(d => d.type === 'topic').append('circle')
        .attr('r', 30)
        .attr('fill', d => {
          const c = d3.color(TOPIC_COLORS[d.label] || '#0ea5e9');
          return c ? c.copy({ opacity: 0.14 }) + '' : '#0ea5e920';
        })
        .attr('stroke',       d => TOPIC_COLORS[d.label] || '#0ea5e9')
        .attr('stroke-width', 1.5)
        .attr('cursor',       'pointer');

      // Topic labels — two-line wrap
      nodeSel.filter(d => d.type === 'topic').append('text')
        .attr('text-anchor',     'middle')
        .attr('dominant-baseline','middle')
        .attr('font-size',       '9px')
        .attr('font-weight',     '700')
        .attr('pointer-events',  'none')
        .attr('fill',            d => TOPIC_COLORS[d.label] || '#0ea5e9')
        .each(function (d) {
          const words = d.label.split(' ');
          const el = d3.select(this);
          if (words.length <= 2) { el.text(d.label); return; }
          const mid = Math.ceil(words.length / 2);
          el.append('tspan').attr('x', 0).attr('dy', '-0.6em').text(words.slice(0, mid).join(' '));
          el.append('tspan').attr('x', 0).attr('dy', '1.2em').text(words.slice(mid).join(' '));
        });

      // Tick
      sim.on('tick', () => {
        linkSel
          .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      // ── Tooltip ──────────────────────────────────────────────────────────────
      const tooltip = document.getElementById('ud-tooltip');
      let tooltipTimer  = null;
      let tooltipHovered = false;
      tooltip.addEventListener('mouseenter', () => { tooltipHovered = true; clearTimeout(tooltipTimer); });
      tooltip.addEventListener('mouseleave', () => {
        tooltipHovered = false; tooltip.style.opacity = '0'; tooltip.style.pointerEvents = 'none';
      });

      nodeSel.filter(d => d.type === 'episode')
        .on('mousemove', function (event, d) {
          const r = wrap.getBoundingClientRect();
          let x = event.clientX - r.left + 14, y = event.clientY - r.top - 10;
          if (x + 280 > r.width) x -= 290;
          tooltip.style.cssText = `left:${x}px;top:${y}px;opacity:1;position:absolute;background:#1a2035;border:1px solid #2d3748;border-radius:9px;padding:10px 13px;font-size:11px;pointer-events:auto;max-width:270px;z-index:100;transition:opacity 0.2s;`;

          const ts        = d.data.timestamps || {};
          const showColor = SHOW_COLORS[d.data.show] || '#f97316';
          const dateStr   = d.data.date ? ' &middot; ' + fmtDate(d.data.date) : '';

          const tagsHtml = d.data.topics.map(t => {
            const color  = TOPIC_COLORS[t] || '#0ea5e9';
            const tsUrl  = ts[t];
            const bgHex  = color + '22';
            const style  = `font-size:9px;padding:3px 8px;border-radius:10px;background:${bgHex};color:${color};display:inline-block;margin:2px 2px 0 0;font-weight:600;`;
            return tsUrl
              ? `<a href="${tsUrl}" target="_blank" style="${style};text-decoration:none;" title="Jump to timestamp">▶ ${t}</a>`
              : `<span style="${style}">${t}</span>`;
          }).join('');

          const ytUrl = d.data.url          || '';
          const spUrl = d.data.spotify_url  || '';
          const platformHtml = (ytUrl || spUrl) ? `
            <div style="display:flex;gap:6px;margin-top:8px;border-top:1px solid #2d3748;padding-top:8px;">
              ${ytUrl ? `<a href="${ytUrl}" target="_blank" style="font-size:10px;color:#ef4444;text-decoration:none;padding:3px 9px;border-radius:5px;background:#ef444420;border:1px solid #ef444440">▶ YouTube</a>` : ''}
              ${spUrl ? `<a href="${spUrl}" target="_blank" style="font-size:10px;color:#1db954;text-decoration:none;padding:3px 9px;border-radius:5px;background:#1db95420;border:1px solid #1db95440">♫ Spotify</a>` : ''}
            </div>` : '';

          tooltip.innerHTML = `
            <div style="font-weight:700;color:#f1f5f9;font-size:13px;margin-bottom:3px">${d.data.name}</div>
            <div style="font-size:10px;font-weight:600;color:${showColor};margin-bottom:3px">● ${d.data.show}${dateStr}</div>
            <div style="color:#94a3b8;font-size:10px;margin-bottom:7px;line-height:1.4">${d.data.role}</div>
            <div style="font-size:9px;color:#475569;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em">Topics${Object.keys(ts).length ? ' — click to jump' : ''}</div>
            <div>${tagsHtml}</div>
            ${platformHtml}`;
        })
        .on('mouseleave', () => {
          tooltipTimer = setTimeout(() => {
            if (!tooltipHovered) { tooltip.style.opacity = '0'; tooltip.style.pointerEvents = 'none'; }
          }, 800);
        });

      nodeSel.filter(d => d.type === 'topic')
        .on('click', (e, d) => { e.stopPropagation(); filterByTopic(d.label); })
        .on('mousemove', function (event, d) {
          const r = wrap.getBoundingClientRect();
          tooltip.style.cssText = `left:${event.clientX - r.left + 14}px;top:${event.clientY - r.top - 10}px;opacity:1;position:absolute;background:#1a2035;border:1px solid #2d3748;border-radius:8px;padding:9px 12px;font-size:11px;pointer-events:none;z-index:10;`;
          tooltip.innerHTML = `<div style="font-weight:700;color:#f1f5f9">${d.label}</div><div style="color:#94a3b8;font-size:10px">${topicCounts[d.label]} episode${topicCounts[d.label] !== 1 ? 's' : ''}</div>`;
        })
        .on('mouseleave', () => { tooltip.style.opacity = '0'; });

      svg.on('click', () => { activeTopics.clear(); buildSidebar(usedTopics, topicCounts); applyFilter(); });

      // ── Sidebar ───────────────────────────────────────────────────────────────
      function buildSidebar(topics, counts) {
        const listEl = document.getElementById('ud-topic-list');
        listEl.innerHTML = '';
        topics.forEach(t => {
          const btn = document.createElement('button');
          btn.className = 'ud-topic-btn' + (activeTopics.has(t) ? ' active' : '');
          btn.innerHTML = `<span class="ud-topic-dot" style="background:${TOPIC_COLORS[t]||'#0ea5e9'}"></span>${t}<span class="ud-topic-count">${counts[t]}</span>`;
          btn.addEventListener('click', () => filterByTopic(t));
          listEl.appendChild(btn);
        });
      }

      function filterByTopic(topic) {
        activeTopics.has(topic) ? activeTopics.delete(topic) : activeTopics.add(topic);
        buildSidebar(usedTopics, topicCounts);
        applyFilter();
      }

      function applyFilter() {
        const matchCountEl = document.getElementById('ud-match-count');
        if (activeTopics.size === 0) {
          // Reset all
          nodeSel.filter(d => d.type === 'episode').select('circle')
            .attr('fill',         d => SHOW_COLORS[d.data.show] || '#f97316')
            .attr('stroke',       '#0f1117')
            .attr('stroke-width', 1.5)
            .attr('opacity',      1);
          nodeSel.filter(d => d.type === 'episode').select('text').attr('opacity', 1);
          nodeSel.filter(d => d.type === 'topic').select('circle').attr('opacity', 1);
          nodeSel.filter(d => d.type === 'topic').select('text').attr('opacity', 1);
          linkSel.attr('stroke-opacity', 0.28);
          matchCountEl.style.display = 'none';
          return;
        }

        const matchEps    = new Set(visEps.filter(ep => [...activeTopics].some(t => ep.topics.includes(t))).map(ep => ep.id));
        const matchTopics = new Set([...activeTopics].map(t => 'topic_' + t));

        matchCountEl.textContent    = `${matchEps.size} episode${matchEps.size !== 1 ? 's' : ''}`;
        matchCountEl.style.display  = 'block';

        nodeSel.filter(d => d.type === 'episode').select('circle')
          .attr('fill',         d => matchEps.has(d.id) ? (SHOW_COLORS[d.data.show] || '#f97316') : '#1a2035')
          .attr('stroke',       d => matchEps.has(d.id) ? '#ffffff' : '#1e2330')
          .attr('stroke-width', d => matchEps.has(d.id) ? 2 : 1)
          .attr('opacity',      d => matchEps.has(d.id) ? 1 : 0.18);
        nodeSel.filter(d => d.type === 'episode').select('text')
          .attr('opacity', d => matchEps.has(d.id) ? 1 : 0.1);
        nodeSel.filter(d => d.type === 'topic').select('circle')
          .attr('opacity', d => matchTopics.has(d.id) ? 1 : 0.12);
        nodeSel.filter(d => d.type === 'topic').select('text')
          .attr('opacity', d => matchTopics.has(d.id) ? 1 : 0.12);
        linkSel.attr('stroke-opacity', d => {
          const id = typeof d.source === 'object' ? d.source.id : d.source;
          return matchEps.has(id) && activeTopics.has(d.topic) ? 0.75 : 0.03;
        });
      }

      document.getElementById('ud-clear-btn').onclick = () => {
        activeTopics.clear(); buildSidebar(usedTopics, topicCounts); applyFilter();
      };

      buildSidebar(usedTopics, topicCounts);
    } // end rebuildGraph

    rebuildGraph();

    window.addEventListener('resize', () => {
      svg.attr('viewBox', `0 0 ${W()} ${H()}`);
      if (sim) sim.force('center', d3.forceCenter(W()/2, H()/2)).alpha(0.1).restart();
    });

  } // end buildGraph

})();
</script>
